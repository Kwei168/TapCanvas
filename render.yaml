# TapCanvas — Render 部署蓝图（后端 hono-api）
#
# 用法：
#   1. 把本仓库推到你自己的 GitHub（fork 或新建仓库）。
#   2. 在 Render 控制台 -> New -> Blueprint -> 连上该 GitHub 仓库 -> 选本文件。
#   3. Render 会自动创建下面的服务 + Postgres 数据库。
#   4. 在 Render 控制台给 tapcanvas-api 服务补充下面标了 "sync: false" 的变量
#      （AI Key、GitHub OAuth、Redis 等），然后手动 Deploy。
#
# 说明：
#   - Redis 在 Render 上是付费的，这里把 REDIS_URL 设为可选（sync: false）。
#     不填也能启动；若需要手机验证码/队列类功能，可改用免费的 Upstash Redis 并填 REDIS_URL。
#   - 应用启动时会按 schema.sql 自动建表，无需手动迁移。
#   - 端口由 Render 注入的 PORT 决定（start 命令里已适配）。

databases:
  - name: tapcanvas-db
    databaseName: tapcanvas
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: tapcanvas-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    #  monorepo：在仓库根目录执行 pnpm install，再只构建 api 包
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @tapcanvas/api prisma:generate && pnpm --filter @tapcanvas/api build
    startCommand: node apps/hono-api/dist/main.js
    healthCheckPath: /health/version
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tapcanvas-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_WORKER_TOKEN
        generateValue: true
      # ---- 可选（不填也能启动，但对应功能不可用）----
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # 前端回填用：把下面改成你 Vercel 前端的地址（如 https://tapcanvas.vercel.app）
      - key: TAPCANVAS_API_BASE_URL
        sync: false
